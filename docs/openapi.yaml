components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AdjustmentInput:
      type: object
      properties:
        email:
          type: string
          format: email
        credits:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        reason:
          type: string
          maxLength: 255
          minLength: 5
        request_key:
          type: string
          format: uuid
      required:
      - credits
      - email
      - reason
      - request_key
    CSRFToken:
      type: object
      properties:
        csrf:
          type: string
      required:
      - csrf
    Credentials:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
        first_name:
          type: string
          maxLength: 150
        referral_code:
          type: string
          maxLength: 12
      required:
      - email
      - password
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        word_count:
          type: integer
          readOnly: true
        size:
          type: integer
          readOnly: true
        format:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - format
      - id
      - size
      - title
      - word_count
    DocumentInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        text:
          type: string
          maxLength: 1000000
        file:
          type: string
          format: uri
      required:
      - title
    ForgotPassword:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
