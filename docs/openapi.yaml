          readOnly: true
        provider:
          type: string
          readOnly: true
        result:
          readOnly: true
        error:
          type: string
          readOnly: true
        report_id:
          type: string
          nullable: true
          readOnly: true
        original_text:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
