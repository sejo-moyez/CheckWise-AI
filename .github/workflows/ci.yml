name: validation
on: [push, pull_request]
jobs:
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: bash scripts/install.sh
        shell: bash
      - run: bash scripts/test.sh
        shell: bash
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: checkwise, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: checkwise}
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U checkwise" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "true"
      DATABASE_URL: postgres://checkwise:ci-only@localhost:5432/checkwise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m venv .venv && .venv/bin/pip install --require-hashes -r backend/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: bash scripts/test.sh
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
